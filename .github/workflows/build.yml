name: Build Windows EXE

# Every push to main: offline logic tests on Ubuntu, then the Windows EXE.
# Download the artifact from the workflow run page (Actions tab).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tzdata openpyxl

      - name: Offline logic tests
        working-directory: src
        run: python test_logic.py

  build:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller
          --onefile
          --windowed
          --name Balfund_Simple_Algo
          --collect-all customtkinter
          --collect-all kiteconnect
          --collect-all autobahn
          --collect-all twisted
          --collect-all openpyxl
          --collect-data tzdata
          --hidden-import service_identity
          --hidden-import OpenSSL
          --hidden-import openpyxl
          --paths src
          src/main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Balfund_Simple_Algo-windows
          path: dist/Balfund_Simple_Algo.exe
          if-no-files-found: error
